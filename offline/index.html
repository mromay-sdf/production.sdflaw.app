<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; script-src 'self' file:; style-src 'self' file:; font-src 'self' file:; img-src 'self' file:; frame-src 'self' file:; connect-src 'none'; object-src 'none'"><title>SDF Production · Offline viewer</title><link rel="stylesheet" href="assets/sdf-tokens.css"><link rel="stylesheet" href="assets/sdf-base.css"><link rel="stylesheet" href="assets/app.css"></head>
<body><header><img src="assets/sdflaw-logo-white.png" alt="Schiller DuCanto & Fleck"><span>Production</span><small>OFFLINE · READ-ONLY SNAPSHOT</small></header>
<div class="heading"><div class="identity"><h1 id="name"></h1><p id="matter"></p></div><div class="summary"><span id="totals"></span><small id="snapshot"></small></div></div>
<main id="viewer"><aside id="index"><div class="index-tools"><h2>Document index <span id="count"></span></h2><label for="search" class="sr-only">Search index / find Bates number</label><input id="search" type="search" placeholder="Search index or Bates number"><label for="tag" class="sr-only">Filter by tag</label><select id="tag"><option value="">All tags</option></select></div><div id="documents"></div></aside>
<div id="divider" role="separator" tabindex="0" aria-label="Resize document index" aria-orientation="vertical" title="Drag to resize · arrow keys to adjust · double-click to reset"></div>
<section><nav><button id="toggle-index" aria-label="Hide document index">Hide index</button><button id="previous">Previous</button><span id="position"></span><button id="next">Next</button><label for="fit" class="sr-only">PDF fit</label><select id="fit" title="Fit is applied by your browser's PDF viewer"><option value="page">Fit page</option><option value="width">Fit width</option></select><button id="copy">Copy Bates range</button><a id="open" target="_blank" rel="noreferrer">Open PDF</a><a id="download" download>Download</a></nav>
<iframe id="preview" title="Selected PDF preview"></iframe><div class="footer"><span id="range"></span><span>Preview unavailable? Use <strong>Open PDF</strong>. Fit controls depend on your browser.</span></div><p id="message" role="status"></p></section></main><script src="assets/data.js"></script><script src="assets/app.js"></script></body></html>
