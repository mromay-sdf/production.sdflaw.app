name: Deploy SDF Production
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sdf-production-deployment
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - name: Package self-contained Linux server dependencies
        run: |
          mkdir release
          cp -R dist dist-server public offline release/
          cp deployment/package.json deployment/package-lock.json release/
          npm ci --omit=dev --prefix release
          printf '#!/bin/sh\nset -eu\ncd /home/site/wwwroot\nexec node dist-server/index.js\n' > release/azure-start.sh
          cd release
          zip -qr ../sdf-production.zip .
      - name: Verify packaged server starts without development dependencies
        run: |
          unzip -q sdf-production.zip -d release-check
          node scripts/smoke-release.mjs release-check
      - uses: actions/upload-artifact@v4
        with:
          name: sdf-production-azure
          path: sdf-production.zip
          retention-days: 7
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: sdf-production-azure

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_AAA379669F384F03922D6291DB6A8094 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_23369F2D20934E32AE4D94D7265C9DD9 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E4B2C009B917478CAEA118B307635E27 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'sdf-production'
          slot-name: 'Production'
          package: sdf-production.zip
          startup-command: sh /home/site/wwwroot/azure-start.sh
