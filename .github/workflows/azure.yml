name: Build and deploy SDF Production
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the tested build to the existing Azure sdf-production app
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: sdf-production-deployment
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - name: Package installed Linux server dependencies
        run: |
          pnpm prune --prod
          mkdir release
          cp -R dist dist-server public offline node_modules release/
          cp deployment/package.json deployment/package-lock.json release/
          printf '#!/bin/sh\nset -eu\ncd /home/site/wwwroot\nexec node dist-server/index.js\n' > release/azure-start.sh
          cd release
          zip -qr ../sdf-production.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: sdf-production-azure
          path: sdf-production.zip
          retention-days: 7
      - name: Deploy to existing Azure App Service
        if: inputs.deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: sdf-production
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: sdf-production.zip
          startup-command: sh /home/site/wwwroot/azure-start.sh
